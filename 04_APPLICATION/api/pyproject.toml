[project]
name = "vaakya-api"
version = "0.1.0"
description = "VAAKYA API: FastAPI, LangGraph agents, deterministic financial core"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "langgraph==1.2.20",
  "llama-index-core==0.14.25",
  "llama-index-vector-stores-qdrant==0.10.4",
  "qdrant-client==1.20.0",
  "neo4j==6.4.1",
  "psycopg[binary]==3.3.8",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "apscheduler==3.11.3",
  "presidio-analyzer==2.2.366",
  "presidio-anonymizer==2.2.366",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "boto3==1.43.124",
  "structlog==26.1.0",
  "ollama==0.6.3",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.2",
  "cryptography==50.0.2",
  "pillow==13.0.0",
  "pypdf==6.21.4",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "pip-licenses==5.5.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the compose services (postgres, neo4j, qdrant, seaweedfs)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
