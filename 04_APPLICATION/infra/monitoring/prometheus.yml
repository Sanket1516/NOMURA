global:
  scrape_interval: 15s
scrape_configs:
  - job_name: vaakya-api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
